name: Feature request
description: Propose a new tool, test or decision rule.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which analysis is difficult or unsupported today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: |
        Describe the tool or rule, the Pingouin function it would call, and the assumptions
        that should be checked before it runs.
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Design constraints
      options:
        - label: The capability exists in Pingouin rather than being approximated.
        - label: The result can include equivalent Pingouin code.
        - label: I can help test it against a real dataset.
