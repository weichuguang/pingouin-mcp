[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "pingouin-mcp"
dynamic = ["version"]
description = "A Model Context Protocol server for statistical analysis with Pingouin, designed for AI research agents"
readme = "README.md"
authors = [{ name = "Pingouin-MCP contributors" }]
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["MCP", "Model Context Protocol", "statistics", "Pingouin", "psychology", "reproducibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "mcp>=1.2.0",
    "fastmcp>=2.14.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pingouin>=0.6.1,<0.7",
    "pandas>=2.0.0",
    "numpy>=1.23.0",
    "scipy>=1.9.0",
    "statsmodels>=0.14.0",
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "tabulate>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/weichuguang/pingouin-mcp"
Repository = "https://github.com/weichuguang/pingouin-mcp"
Issues = "https://github.com/weichuguang/pingouin-mcp/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
pingouin-mcp = "pingouin_mcp.cli:main"

[tool.hatch.version]
path = "src/pingouin_mcp/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pingouin_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
